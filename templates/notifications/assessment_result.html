{% extends "notifications/_email_base.html" %}

{% block content %}
    <h1 style="margin:0 0 12px;font-size:22px;">Result ready</h1>
    <p style="margin:0 0 12px;">{{ assessment.name }} for {{ student.full_name }} has been marked.</p>
    <table role="presentation" cellpadding="0" cellspacing="0" style="margin:16px 0;font-size:15px;">
        <tr>
            <td style="padding:4px 16px 4px 0;color:#8a8f98;">Score</td>
            <td style="padding:4px 0;font-weight:bold;">{{ submission.total_score }} / {{ assessment.max_score }}</td>
        </tr>
    </table>
    <p style="margin:0;color:#8a8f98;font-size:13px;">Sign in to the portal for the full breakdown.</p>
{% endblock %}
