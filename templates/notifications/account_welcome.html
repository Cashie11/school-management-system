{% extends "notifications/_email_base.html" %}

{% block content %}
    <h1 style="margin:0 0 12px;font-size:22px;">Your account is ready</h1>
    <p style="margin:0 0 12px;">An account has been created for you at {{ school.name }}.</p>
    <table role="presentation" cellpadding="0" cellspacing="0" style="margin:16px 0;font-size:15px;">
        <tr>
            <td style="padding:4px 16px 4px 0;color:#8a8f98;">Sign in with</td>
            <td style="padding:4px 0;font-weight:bold;">{{ user.email }}</td>
        </tr>
        <tr>
            <td style="padding:4px 16px 4px 0;color:#8a8f98;">Role</td>
            <td style="padding:4px 0;font-weight:bold;">{{ role }}</td>
        </tr>
    </table>
    <p style="margin:0 0 12px;">Use the password set by the school office. Change it after your first sign in.</p>
{% endblock %}
