{% extends "base.html" %}

{% block title %}Password set{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <h1 class="card-title">Password set</h1>
        <p class="card-subtitle">Your password has been changed. You can sign in with it now.</p>
        <p class="auth-foot">
            <a class="btn btn-primary" href="{% url 'accounts:login' %}"><i class="bi bi-box-arrow-in-right"></i> Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
