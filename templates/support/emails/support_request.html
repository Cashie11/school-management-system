<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px;background:#ecebe8;font-family:'Red Hat Display',Arial,sans-serif;color:#29303d;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:16px;">
        <tr>
            <td style="padding:28px 32px;">
                <p style="margin:0 0 4px;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(41,48,61,0.62);">Support request</p>
                <h1 style="margin:0 0 20px;font-size:22px;">{{ message.subject }}</h1>
                <p style="margin:0 0 6px;font-size:14px;"><strong>{{ message.name }}</strong> &lt;{{ message.email }}&gt;</p>
                {% if message.school %}<p style="margin:0 0 6px;font-size:14px;color:rgba(41,48,61,0.62);">School: {{ message.school.name }}</p>{% endif %}
                <p style="margin:0 0 20px;font-size:14px;color:rgba(41,48,61,0.62);">{{ message.created_at|date:"j M Y, H:i" }}</p>
                <p style="margin:0;font-size:15px;line-height:1.7;white-space:pre-line;">{{ message.body }}</p>
            </td>
        </tr>
    </table>
</body>
</html>
